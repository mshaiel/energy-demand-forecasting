xgboost:
  objective: "reg:quantileerror"
  n_estimators: 2000
  learning_rate: 0.03
  max_depth: 7
  subsample: 0.8
  colsample_bytree: 0.75
  min_child_weight: 5
  gamma: 0.1
  early_stopping_rounds: 50

lstm:
  hidden_dim: 256
  n_layers: 2
  dropout: 0.3
  horizon: 24
  seq_len: 168
  n_features: 9
  batch_size: 64
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001

chronos:
  model_variant: "amazon/chronos-t5-small"
  num_samples: 200
  torch_dtype: "bfloat16"

sarimax:
  order: [2, 1, 2]
  seasonal_order: [1, 1, 1, 7]
  resample_freq: "D"

evaluation:
  quantiles: [0.1, 0.5, 0.9]
  ci_alpha: 0.2
